          content="A Mater Domus é um e-commerce focado em utilidades domésticas e organização, com parcerias sólidas e crescimento sustentável para fornecedores." />
    
    <meta name="robots" content="index, follow" />
    <base href="/" />
    
    <link href="css/site.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />

            new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5FJ38X8C');</script>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5FJ38X8C"
                  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<div id="app">
    <div class="boot-screen" id="boot-screen">
        <img class="boot-screen__logo"
             src="images/logo.png"
             alt="MaterDomus" />
        <div class="boot-screen__spinner" aria-hidden="true"></div>
        <p class="boot-screen__message">Um instante…</p>

        <!-- Estado de falha (oculto por padrão; só após timeout longo ou falha clara do runtime) -->
        <div class="boot-screen__error" id="boot-error" hidden>
            <p>Está demorando mais que o normal. Tente recarregar.</p>
            <button type="button" onclick="location.reload()">Recarregar</button>
        </div>
    </div>
</div>

<script>
    (function () {
        var BOOT_TIMEOUT_MS = 80000;
        var failureShown = false;

        function showBootFailure() {
            if (failureShown) return;
            var screen = document.getElementById('boot-screen');
            if (!screen) return;
            failureShown = true;
            if (window.__bootTimer) {
                clearTimeout(window.__bootTimer);
                window.__bootTimer = null;
            }
            var spinner = screen.querySelector('.boot-screen__spinner');
            var msg = screen.querySelector('.boot-screen__message');
            var err = document.getElementById('boot-error');
            if (spinner) spinner.style.display = 'none';
            if (msg) msg.style.display = 'none';
            if (err) err.hidden = false;
            // Logo permanece visível.
        }

        window.__showBootFailure = showBootFailure;
        window.__bootTimer = setTimeout(showBootFailure, BOOT_TIMEOUT_MS);

        window.addEventListener('error', function (event) {
            var target = event.target;
            var src = (event.filename || (target && (target.src || target.href)) || '');
            if (typeof src === 'string' &&
                (src.indexOf('blazor.webassembly') !== -1 || src.indexOf('_framework/') !== -1)) {
                showBootFailure();
            }
        }, true);
    })();
</script>

<script src="js/analytics.js"></script>
<script src="_framework/blazor.webassembly.js" autostart="false"></script>
<script>
    if (typeof Blazor === 'undefined' || typeof Blazor.start !== 'function') {
        if (window.__showBootFailure) window.__showBootFailure();
    } else {
        Blazor.start().catch(function () {
            if (window.__showBootFailure) window.__showBootFailure();
        });
    }
</script>
</body>
</html>
